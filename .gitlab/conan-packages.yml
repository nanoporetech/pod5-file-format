  parallel:
    matrix:
      - CONAN_PROFILE_BUILD_TYPE: ["Debug", "Release"]
        COMPILER: [gcc11, gcc13]
        SANITIZER: ["", "-asan-static", "-usan-static", "-tsan-static"]
  variables:
      PROFILE_BASE: linux-x86_64-${COMPILER}${SANITIZER}.jinja

