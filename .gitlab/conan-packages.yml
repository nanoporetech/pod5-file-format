.reset-line-endings:
  # This is needed to enforce LF line-endings in the pybind submodule
  # otherwise conan generates different revisions for windows and unix
  - re='^(MINGW|CYGWIN|MSYS).*'
  - if [[ $(uname -s) =~ $re ]]; then
  -   cd third_party/pybind11
  -   git rm -rfq :/
  -   git config core.autocrlf false
  -   git checkout HEAD -- :/
  -   cd "${CI_PROJECT_DIR}"
  - fi

.conan2-build:
  stage: build-conan
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
      variables:
        UPLOAD_ARGS: "--force"
        CONAN_REPO: "ONT-Conan-V2"
    - when: on_success
      variables:
        UPLOAD_ARGS: "--dry-run"
        CONAN_REPO: "ONTDev-Conan-V2"
  needs: ["prepare_version"]
  script:
    - !reference [".reset-line-endings"]
    - uv venv --python=3.14 .venv
    - source .venv/*/activate
    - uv pip install conan cmake
    - conan --version
    - conan remove "*" --confirm
    - conan config install --verify-ssl=no "${CONAN2_CONFIG_URL}"
    - version=$(cmake -P ci/get_tag_version.cmake 2>&1 | cut -d. -f1-3)
      # set up the correct ref
    - opts=("--version=${version}" --user=nanopore --channel=stable)
      # fail if we can't find dependencies
    - opts+=("--build=pod5_file_format/*")
      # select the build profile
    - opts+=(-pr:a "${PROFILE_BASE}")
    - echo "Running conan create . ${opts[@]}"
    - conan create . "${opts[@]}" ${POD5_CONAN_INSTALL_ARROW_ARGS} ${POD5_CONAN_INSTALL_LICENCE_ARGS}
    - conan remote enable "$CONAN_REPO"
    - conan remote auth --force "$CONAN_REPO"
    - conan upload "pod5_file_format/*:*" --check --confirm "--remote=$CONAN_REPO" ${UPLOAD_ARGS}
  variables:
    # use an arrow package that doesn't use Boost, even on Windows
    # use patched jemalloc 5.2.1 to get around "non-positive bound in array definition" issue
    # note that the jemalloc override can go away once we've upgraded to 5.3
    CONAN_MANUAL_OVERRIDES: "arrow/*:arrow/*@nanopore/noboost;jemalloc/5.2.1:jemalloc/5.2.1@nanopore/stable"
    CONAN_PROFILE_CPPSTD: "20"
  parallel:
    matrix:
      - CONAN_PROFILE_BUILD_TYPE: ["Debug", "Release"]

build-conan2:windows-x86_64-vs2019:
  extends: [.conan2-build]
  tags:
    - windows
    - VS2019
  variables:
    PROFILE_BASE: windows-x86_64-vs2019.jinja

build-conan2:windows-x86_64-vs2022:
  extends: [.conan2-build]
  tags:
    - windows
    - VS2022
  variables:
    PROFILE_BASE: windows-x86_64-vs2022.jinja

build-conan2:macos-aarch64-appleclang-15.0:
  extends: [.conan2-build]
  tags:
    - osx_arm64
    - xcode-15.3
  variables:
    PROFILE_BASE: macos-aarch64-appleclang-15.0.jinja

build-conan2:macos-aarch64-appleclang-16.0:
  extends: [.conan2-build]
  tags:
    - osx_arm64
    - xcode-16.1
  variables:
    PROFILE_BASE: macos-aarch64-appleclang-16.0.jinja

build-conan2:linux-x86_64:
  extends: [.conan2-build]
  tags: [linux, prod, x86_64, eks, small, standard]
  image: "${ONT_DOCKER_REGISTRY}/informatics/rocky8-${COMPILER}"
  parallel:
    matrix:
      - CONAN_PROFILE_BUILD_TYPE: ["Debug", "Release"]
        COMPILER: [gcc11, gcc13]
        SANITIZER: ["", "-asan-static", "-usan-static", "-tsan-static"]
  variables:
      PROFILE_BASE: linux-x86_64-${COMPILER}${SANITIZER}.jinja

build-conan2:linux-aarch64:
  extends: [.conan2-build]
  tags: [linux, prod, aarch64, eks, small, standard]
  image: "${ONT_DOCKER_REGISTRY}/informatics/rocky8-${COMPILER}"
  parallel:
    matrix:
      - CONAN_PROFILE_BUILD_TYPE: ["Debug", "Release"]
        COMPILER: [gcc11, gcc13]
  variables:
      PROFILE_BASE: linux-aarch64-${COMPILER}.jinja
